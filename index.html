<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aGENtic Hub</title>
<meta name="description" content="Your PC's trainings, watched and steered from your phone.">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #eef0f5; --card: #ffffff; --ink: #1d2230; --sub: #5b6377; --line: #dde1ea;
    --accent: #4f7cff; --ok: #1f9d5c; --warn: #b7791f; --bad: #b42318; --soft: #f5f6fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141b; --card: #1a1f2a; --ink: #e6e9f0; --sub: #9aa3b5; --line: #2a3140;
            --accent: #7b9cff; --ok: #3ccf86; --warn: #e3a93b; --bad: #ff6b5f; --soft: #222837; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--sub); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--sub); }
  .dot.on { background: var(--ok); } .dot.late { background: var(--warn); } .dot.off { background: var(--bad); }
  main { padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 720px; margin: 0 auto; }
  main > *, .card > *, .event > * { min-width: 0; overflow-wrap: anywhere; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: 650; overflow-wrap: anywhere; }
  .pill { font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); white-space: nowrap; }
  .pill.running { color: var(--accent); border-color: var(--accent); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.stopped, .pill.failed { color: var(--warn); border-color: var(--warn); }
  .big { font-size: 26px; font-weight: 700; }
  .sub { color: var(--sub); font-size: 13px; overflow-wrap: anywhere; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .bar.goal { position: relative; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 9px; padding: 9px 14px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); min-height: 40px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: 0.5; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; border-radius: 0; background: none; color: var(--sub); min-height: 56px; font-size: 13px; }
  nav button.on { color: var(--accent); font-weight: 650; }
  input { font: inherit; width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }
  label { display: grid; gap: 4px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { color: var(--sub); font-weight: 600; font-size: 12px; }
  .spark { display: flex; gap: 3px; align-items: flex-end; height: 26px; }
  .spark span { width: 8px; background: var(--accent); border-radius: 2px 2px 0 0; opacity: 0.8; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); padding: 12px; border-radius: 10px;
           background: var(--ink); color: var(--bg); display: none; z-index: 3; }
  .empty { color: var(--sub); text-align: center; padding: 24px 8px; }
  a { color: var(--accent); }
  h2.section { font-size: 14px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 2px 0; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .tile b { display: block; font-size: 24px; }
  .tile span { color: var(--sub); font-size: 12px; }
  .alert { border-left: 4px solid var(--warn); }
  .alert.bad { border-left-color: var(--bad); }
  .event { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .event:last-child { border-bottom: 0; }
  .event time { color: var(--sub); font-variant-numeric: tabular-nums; }
  .event em { font-style: normal; color: var(--accent); font-weight: 600; }
  .budget { position: relative; height: 12px; border-radius: 6px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
  .budget > span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); opacity: .8; }
  .budget > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .45; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin: 0; }
  .kv dt { color: var(--sub); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pics img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #111; border-radius: 8px; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .tiers b { display: block; font-size: 18px; }
  .tiers span { color: var(--sub); font-size: 12px; }
  .tiles.four { grid-template-columns: repeat(4, 1fr); }
  .tiles.four .tile b { font-size: 18px; }
  details > summary { color: var(--accent); font-size: 13px; cursor: pointer; padding: 4px 0; }
  .log { font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--sub); white-space: pre-wrap;
         overflow-wrap: anywhere; background: var(--soft); border-radius: 8px; padding: 8px; margin-top: 6px; }
  .area { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; margin-bottom: 6px; }
  .area .bar { grid-column: 1 / -1; }
  .stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--soft); grid-column: 1 / -1; gap: 2px; }
  .stack > span:nth-child(1) { background: var(--ok); } .stack > span:nth-child(2) { background: var(--warn); opacity: .7; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.rpics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}.rpic{margin:0}.rpic img{width:100%;border-radius:8px;background:#fff;min-height:60px}.rpic figcaption{font-size:12px;opacity:.7}
  html, body { max-width: 100%; overflow-x: hidden; }
  button { max-width: 100%; white-space: normal; }
  .tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile { min-width: 0; overflow-wrap: anywhere; }
  .hero { gap: 6px; } .hero-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 17px; }
  .hero.off { border-left: 4px solid var(--bad); }
  .calm { border-left: 4px solid var(--ok); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .skill { min-width: 0; width: 100%; display: grid; gap: 6px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
           padding: 12px; min-height: 112px; align-content: start; }
  .skill.running { border-color: var(--accent); }
  .skill-name { font-weight: 650; font-size: 15px; }
  .skill-score { font-size: 28px; font-weight: 750; line-height: 1.1; }
  .skill-state { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 4px; }
  .skill.done .skill-state { color: var(--ok); } .skill.stopped .skill-state { color: var(--warn); }
  .rowcard { text-align: left; width: 100%; font: inherit; color: inherit; }
  .hint { padding: 0 2px; }
  .lead { font-size: 15px; }
  .big-title { font-size: 20px; }
  .clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  button.wide { width: 100%; min-height: 48px; font-weight: 650; }
  button.link { background: none; border: 0; color: var(--accent); padding: 4px 8px; min-height: 0; }
  .actions.three button { flex: 1; min-height: 48px; }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: center; }
  .versus b { display: block; font-size: 26px; } .versus span { color: var(--sub); font-size: 12px; }
  .banner.good { border-left: 4px solid var(--ok); } .banner { border-left: 4px solid var(--accent); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; }
  .spin.small { width: 10px; height: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff;
               font-size: 11px; margin-left: 4px; line-height: 18px; }
  header .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header .top button { min-height: 34px; padding: 4px 12px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>aGENtic Hub</h1><button id="refresh" aria-label="Refresh now">↻ Refresh</button></div>
  <div class="meta" id="meta">Not connected</div>
</header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-tab="home" class="on">Home</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="check" id="tab-check">Check</button>
  <button data-tab="more">More</button>
</nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
// The phone side of aGENtic Hub's dashboard. Everything goes through GitHub:
// the PC writes status.json to a private repo of yours; this page reads it and
// writes signed commands there, with a token that reaches only that repo.
const API = "https://api.github.com";
const APP_VERSION = "2026-10-29 · 2";          // shown under More: which phone app this is
const store = {
  get(k) { try { return localStorage.getItem("agh." + k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem("agh." + k, v); } catch { /* private mode: kept for this visit */ } },
};
// Tabs of the earlier phone page map onto the simpler ones.
const OLD_TABS = { now: "home", trainings: "skills", report: "skills" };
let status = null, tab = OLD_TABS[store.get("tab")] || store.get("tab") || "home", lastFetch = 0, busy = false;
const opened = new Set();                         // the <details> left open survive the minute's refresh
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v == null ? "–" : `${Math.round(v * 10) / 10}%`);

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4000);
}

// A pairing link (#pair=<repo>) fills the repo; the code and the token are typed here once.
(function readPairLink() {
  const m = location.hash.match(/pair=([^&]+)/);
  if (m) { store.set("repo", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
})();

async function gh(path, init = {}) {
  const res = await fetch(`${API}/${path}`, { ...init, headers: { Authorization: `Bearer ${store.get("token")}`,
    Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(init.headers || {}) } });
  return res;
}

async function load() {
  if (!store.get("token") || !store.get("repo")) { tab = "settings"; render(); return; }
  if (progress && progress.ok != null && Date.now() - (progress.shown || (progress.shown = Date.now())) > 60000) progress = null;
  try {
    const res = await gh(`repos/${store.get("repo")}/contents/status.json?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" } });
    if (res.status === 401 || res.status === 403) throw new Error("GitHub refused the token - check it in Phone.");
    if (res.status === 404) throw new Error("No status yet - is the dashboard on, on the PC?");
    status = await res.json(); lastFetch = Date.now();
  } catch (err) { toast(err.message || String(err)); }
  render();
}

function freshness() {
  if (!status) return ["off", "Not connected"];
  const age = (Date.now() - Date.parse(status.at_utc || "")) / 1000;
  if (!isFinite(age)) return ["late", `updated ${status.at}`];
  const ago = age < 90 ? `${Math.max(0, Math.round(age))}s ago` : age < 5400 ? `${Math.round(age / 60)} min ago` : `${Math.round(age / 3600)} h ago`;
  return [age < 900 ? "on" : age < 3600 ? "late" : "off", `${esc(status.host)} · updated ${ago}`];
}

// Commands: canonical JSON (keys sorted), signed with the pairing code.
function canonical(v) {
  if (Array.isArray(v)) return `[${v.map(canonical).join(",")}]`;
  if (v && typeof v === "object") return `{${Object.keys(v).sort().map((k) => `${JSON.stringify(k)}:${canonical(v[k])}`).join(",")}}`;
  return JSON.stringify(v);
}
async function hmac(text) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(store.get("code").replace(/[-\s]/g, "").toUpperCase()),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(text));
  return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function b64(text) { return btoa(String.fromCharCode(...new TextEncoder().encode(text))); }

async function command(action, target, args, label) {
  if (busy) return;
  busy = true; progress = { label, stage: "Sending it to your PC…" }; render();
  try {
    const id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
    const body = { id, action, target: String(target), args: args || {}, at: new Date().toISOString().slice(0, 19) + "Z" };
    body.sig = await hmac(canonical(body));
    const put = await gh(`repos/${store.get("repo")}/contents/commands/${id}.json`, { method: "PUT",
      body: JSON.stringify({ message: `phone: ${action}`, content: b64(JSON.stringify(body)) }) });
    if (!put.ok) throw new Error(`GitHub refused the command (${put.status}).`);
    progress = { label, stage: "Sent. Waiting for your PC to pick it up (it looks every 30 seconds)…" }; render();
    for (let i = 0; i < 24; i++) {
      await new Promise((r) => setTimeout(r, 7500));
      if (i === 6) { progress.stage = "Still waiting - your PC may be busy or asleep…"; render(); }
      const res = await gh(`repos/${store.get("repo")}/contents/results/${id}.json`, { headers: { Accept: "application/vnd.github.raw+json" } });
      if (res.ok) {
        const result = await res.json();
        progress = result.ok ? { label, stage: "Done. Your PC did it.", ok: true } : { label, stage: `Your PC could not: ${result.error}`, ok: false };
        await load(); return;
      }
    }
    progress = { label, stage: "No answer in 3 minutes - is your PC on? It will still do it when it wakes.", ok: false };
  } catch (err) { progress = { label, stage: err.message || String(err), ok: false }; }
  finally { busy = false; render(); }
}

function spark(values) {
  const v = (values || []).filter((x) => x != null);
  if (v.length < 2) return "";
  return `<div class="spark" aria-label="exams: ${v.map(pct).join(", ")}">${v.map((x) => `<span style="height:${Math.max(3, x * 0.26)}px" title="${pct(x)}"></span>`).join("")}</div>`;
}


const short = (m) => String(m || "").split("/").pop();
const today = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
// "10-22 08:25:36" -> "08:25" today, "10-21 17:18" before.
const when = (at) => { const t = String(at || ""); return t.length >= 14 ? (t.slice(0, 5) === today() ? t.slice(6, 11) : t.slice(0, 11)) : t.slice(0, 5); };
const ago = (iso) => { const s = (Date.now() - Date.parse(iso)) / 1000; return !isFinite(s) ? "" : s < 3600 ? `${Math.max(1, Math.round(s / 60))} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };

function logBox(key, lines, label) {
  // A card's own log, newest last, folded until tapped.
  if (!(lines || []).length) return "";
  return `<details data-key="${esc(key)}"${opened.has(key) ? " open" : ""}><summary>${esc(label || "What it did lately")} (${lines.length})</summary>
    <div class="log">${lines.map(esc).join("\n")}</div></details>`;
}

function pcTiles() {
  // The PC's load: is it straining while everything trains?
  const pc = status?.pc;
  if (!pc || pc.cpu == null) return "";
  const ram = pc.ram_total ? Math.round((100 * pc.ram_used) / pc.ram_total) : null;
  const tone = (v, warn, bad) => (v == null ? "" : v >= bad ? "bad" : v >= warn ? "warn" : "ok");
  return `<div class="tiles four">
      <div class="tile"><b class="${tone(pc.cpu, 70, 90)}">${pc.cpu}%</b><span>processor</span></div>
      <div class="tile"><b class="${tone(ram, 80, 92)}">${ram ?? "–"}%</b><span>memory · ${pc.ram_used}/${pc.ram_total} GB</span></div>
      <div class="tile"><b>${pc.blenders}</b><span>Blender${pc.blenders === 1 ? "" : "s"} · ${pc.blender_gb} GB</span></div>
      <div class="tile"><b>${pc.disk_free_gb ?? "–"}</b><span>GB free</span></div>
    </div>`;
}

function now() {
  // The broader picture: what needs you, what runs, each free model's day, and the latest events from everything.
  if (!status) return `<div class="empty">No status yet.</div>`;
  const ag = status.agents || [], sk = status.trainings || [], jobs = status.jobs || [], alerts = status.alerts || [];
  const live = ag.filter((a) => a.running).length + sk.filter((t) => ["running", "queued"].includes(t.status)).length
    + (status.v2?.status === "running" ? 1 : 0);
  const approved = sk.filter((t) => t.status === "approved").length;
  const tiles = `<div class="tiles">
      <div class="tile"><b>${live}</b><span>training now</span></div>
      <div class="tile"><b>${jobs.length}</b><span>background jobs</span></div>
      <div class="tile"><b style="color:${alerts.length ? "var(--warn)" : "var(--ok)"}">${alerts.length}</b><span>need you</span></div>
    </div>`;
  const quiet = (Date.now() - Date.parse(status.at_utc || "")) / 60000;
  // The PC writes every 2-10 minutes while it is on; a long silence is the PC asleep, off or offline - never
  // this phone's network (everything goes through GitHub). What is below is from when it last wrote.
  const silence = quiet > 20 ? `<section class="card alert bad"><div><b>The PC has sent nothing for ${quiet < 120 ? Math.round(quiet) + " min" : Math.round(quiet / 60) + " h"}.</b>
      It is asleep, off or without internet - training stops with it. Below is what it said last, at ${esc(String(status.at).slice(11, 16))}.</div></section>` : "";
  const alertCards = silence + alerts.map((a) => `<section class="card alert ${a.level === "bad" ? "bad" : ""}"><div>${esc(a.text)}</div></section>`).join("");
  const running = [
    ...ag.filter((a) => a.running).map((a) => ({ name: a.name, kind: "agent", score: a.exam, target: a.target,
      what: a.last, model: a.model, extra: a.recipe ? `reviews: ${a.recipe}` : "" })),
    ...sk.filter((t) => ["running", "queued"].includes(t.status)).map((t) => ({ name: t.software, kind: "skill",
      score: t.exam, target: t.aim, what: t.activity || t.now, model: t.worker,
      extra: t.progress ? `exam ${t.progress.done ?? "?"}/${t.progress.total ?? "?"}` : `round ${t.round} · ${t.hours ?? 0} h` })),
  ];
  const runningCards = running.map((r) => `<section class="card">
      <div class="row"><span class="title">${esc(r.name)}</span><span class="pill running">${r.kind}</span></div>
      <div class="row"><span class="big">${pct(r.score)}</span><span class="sub">${r.target ? `target ${r.target}%` : ""}${r.extra ? ` · ${esc(r.extra)}` : ""}</span></div>
      <div class="bar"><span style="width:${Math.min(100, r.score || 0)}%"></span></div>
      ${r.model ? `<div class="sub">model: ${esc(short(r.model))}</div>` : ""}
      ${r.what ? `<div class="sub">${esc(r.what)}</div>` : ""}</section>`).join("")
    || (status.v2?.status === "running" ? "" : `<div class="empty">Nothing is training right now · ${approved} skills approved</div>`);
  const jobCards = jobs.map((j) => `<section class="card"><div class="row"><span class="title">${esc(j.kind)}</span><span class="sub">${esc(j.on)}</span></div>
      <div class="sub">${esc(j.now)}</div>${j.done && j.done.length ? `<div class="sub">done: ${j.done.map(esc).join(", ")}</div>` : ""}</section>`).join("");
  const tight = (status.budget || []).filter((b) => b.limit).sort((x, y) => y.used / y.limit - x.used / x.limit).slice(0, 4);
  const events = (status.events || []).slice(0, 25).map((e) =>
    `<div class="event"><time>${esc(when(e.at))}</time><span><em>${esc(e.from)}</em> ${esc(e.what)}</span></div>`).join("");
  return `${tiles}${alertCards}${pcTiles()}
    <h2 class="section">Running</h2>${runningCards}${jobCards}${v2Card(true)}
    ${tight.length ? `<h2 class="section">Free allowances today</h2><section class="card">${tight.map(budgetRow).join("")}
      <div class="sub">The marks: where the arena, checking and training stop on each model's day. More in Budget.</div></section>` : ""}
    <h2 class="section">Latest</h2><section class="card">${events || `<div class="sub">No events yet.</div>`}</section>
    <div class="sub" style="text-align:center">The app on ${esc(status.host)} has run ${status.uptime_h ?? "?"} h since it last started.</div>`;
}

function budgetRow(b) {
  const shares = (status && status.shares) || { arena: 0.3, verify: 0.45, training: 0.75 };
  const used = Math.min(100, (100 * b.used) / Math.max(1, b.limit));
  return `<div style="display:grid;gap:4px;margin-bottom:8px">
      <div class="row"><span>${esc(b.scope)}${b.assumed ? ' <span class="sub">(assumed day)</span>' : ""}</span><span class="sub">${b.used} of ${b.limit}</span></div>
      <div class="budget" role="img" aria-label="${b.used} of ${b.limit} calls used today"><span style="width:${used}%"></span>
        ${["arena", "verify", "training"].map((k) => `<i style="left:${shares[k] * 100}%" title="${k} stops here"></i>`).join("")}</div>
      <div class="sub">left for training ${b.left.training ?? "–"} · checking ${b.left.verify ?? "–"} · arena ${b.left.arena ?? "–"}</div></div>`;
}


function v2Card(compact) {
  // Blender training v2: the mastery by tier, today's plan, procedures, exams - and the week's spot checks.
  const v = status?.v2;
  if (!v) return "";
  const tiers = ["core", "common", "specialist"].map((k) =>
    `<div><b>${v.tiers?.[k]?.mastered ?? 0}/${v.tiers?.[k]?.techniques ?? 0}</b><span>${k}</span></div>`).join("");
  const exams = (v.exams || []).map((e) => `${esc(e.tier)} ${pct(e.accuracy)}`).join(" · ");
  const running = v.status === "running";
  return `<section class="card">
      <div class="row"><span class="title">Blender v2</span><span class="pill ${running ? "running" : ""}">${esc(v.status)}</span></div>
      <div class="sub">techniques mastered by tier</div><div class="tiers">${tiers}</div>
      <dl class="kv"><dt>today</dt><dd>${(v.plan || []).length} technique-levels${v.model ? ` · ${esc(short(v.model))}` : ""}</dd>
        <dt>procedures</dt><dd>${v.procedures} proven</dd><dt>attempts</dt><dd>${v.totals?.attempts ?? 0} · ${v.totals?.verified ?? 0} fully right</dd>
        ${exams ? `<dt>exams</dt><dd>${exams}</dd>` : ""}${v.flagged ? `<dt>flagged</dt><dd>${v.flagged} stuck</dd>` : ""}</dl>
      ${v.now ? `<div class="sub">${esc(v.now)}</div>` : ""}
      ${compact ? "" : `<div class="actions">${running
        ? `<button class="danger" data-cmd="v2.stop" data-target="blender" data-label="Stop Blender v2">Stop</button>`
        : `<button class="primary" data-cmd="v2.start" data-target="blender" data-label="Start Blender v2">Start</button>`}</div>`}
      ${v.spot?.pending ? `<div class="sub">${v.spot.pending} result(s) to spot-check this week - below.</div>` : ""}
    </section>`;
}

const spotNotes = {};
function spotChecks() {
  const s = status?.v2?.spot;
  if (!s || !(s.items || []).length) return "";
  const a = s.agreement || {};
  const cards = s.items.map((i) => `<section class="card">
      <div class="row"><span class="title">${esc(i.title)}</span><span class="pill">${i.level === "drill" ? "drill" : "start → goal"}</span></div>
      <div class="pics"><img data-spot="${esc(i.id)}-render" alt="the result"><img data-spot="${esc(i.id)}-goal" alt="the goal"></div>
      <div class="sub">${esc(i.instruction)}</div>
      <div class="sub">checks ${pct(i.score)}${i.verified ? " · all met" : ""}${i.quality != null ? ` · critic ${pct(i.quality)}` : ""}</div>
      ${(i.unmet || []).length ? `<div class="sub">unmet: ${i.unmet.map(esc).join("; ")}</div>` : ""}
      ${i.grade ? `<div class="pill done">you said: ${esc(i.grade)}</div>` : `
        <input data-note="${esc(i.id)}" placeholder="a note (for wrong)" value="${esc(spotNotes[i.id] || "")}">
        <div class="actions">
          <button class="primary" data-spot-grade="right" data-id="${esc(i.id)}">Right</button>
          <button class="danger" data-spot-grade="wrong" data-id="${esc(i.id)}">Wrong</button>
          <button data-spot-grade="skip" data-id="${esc(i.id)}">Skip</button>
        </div>`}
    </section>`).join("");
  return `<h2 class="section">Spot checks · ${esc(s.week)}</h2>
    <div class="sub">critic agrees with you ${a.critic_agreement != null ? Math.round(a.critic_agreement * 100) + "%" : "–"} · checks agree ${a.code_agreement != null ? Math.round(a.code_agreement * 100) + "%" : "–"}</div>${cards}`;
}

const spotImages = {};
async function loadSpotImages() {
  // The renders come from the private relay with this phone's own token; shown as local blobs.
  for (const img of document.querySelectorAll("img[data-spot]")) {
    const key = img.dataset.spot;
    if (spotImages[key] === undefined) {
      spotImages[key] = null;
      try {
        const res = await gh(`repos/${store.get("repo")}/contents/spot/${key}.jpg`, { headers: { Accept: "application/vnd.github.raw+json" } });
        spotImages[key] = res.ok ? URL.createObjectURL(await res.blob()) : "";
      } catch { spotImages[key] = ""; }
    }
    if (spotImages[key]) img.src = spotImages[key]; else if (spotImages[key] === "") img.alt = "picture not sent yet";
  }
}

function blender() {
  // Everything about Blender v2 on one screen: the mastery, what it tried lately, its procedures, where it is
  // stuck, its own log, the atlas of the program it trains on, and the week's spot checks.
  const v = status?.v2, at = status?.atlas;
  if (!v && !at) return `<div class="empty">Blender v2 has not started on this PC.</div>`;
  let out = v ? v2Card(false) : "";
  if (v && (v.areas || []).length) {
    out += `<h2 class="section">Mastery by area</h2><section class="card">${v.areas.map((a) => `<div class="area">
        <span>${esc(a.area)}</span><span class="sub">${a.mastered}/${a.techniques} mastered · ${a.attempts} tries</span>
        <div class="bar"><span style="width:${a.techniques ? (100 * a.mastered) / a.techniques : 0}%;background:var(--ok)"></span></div></div>`).join("")}
      <div class="sub">A technique counts as mastered at 80% over its last 6 drills.</div></section>`;
  }
  if (v && (v.recent || []).length) {
    out += `<h2 class="section">Latest attempts</h2><section class="card">${v.recent.map((r) => `<div class="event">
        <time>${esc(when(String(r.at || "").slice(5, 10) + " " + String(r.at || "").slice(11, 19)))}</time>
        <span><em>${esc(r.title)}</em> <span class="sub">${r.level === "drill" ? "drill" : "start → goal"}</span>
          <b class="${r.verified ? "ok" : (r.score || 0) >= 50 ? "warn" : "bad"}"> ${pct(r.score)}</b>
          <span class="sub">${r.tries} ${r.tries === 1 ? "try" : "tries"}${r.quality != null ? ` · critic ${pct(r.quality)}` : ""} · ${esc(short(r.model))}</span>
          ${!r.verified && (r.unmet || []).length ? `<div class="sub">unmet: ${r.unmet.map(esc).join("; ")}</div>` : ""}</span></div>`).join("")}</section>`;
  }
  if (v && (v.procedure_list || []).length) {
    out += `<h2 class="section">Procedures it proved</h2><section class="card"><table><tr><th>Procedure</th><th>Passes</th><th>Used</th></tr>
      ${v.procedure_list.map((p) => `<tr><td>${esc(p.name)}()<div class="sub">${esc(p.technique)}</div></td><td>${Math.round((p.pass_rate || 0) * 100)}%</td>
        <td>${p.uses}${p.fails ? ` <span class="bad">(${p.fails} failed)</span>` : ""}</td></tr>`).join("")}</table>
      <div class="sub">Functions written from passed attempts, kept only after they redid their own task and others.</div></section>`;
  }
  if (v && (v.stuck || []).length) {
    out += `<h2 class="section">Stuck</h2><section class="card">${v.stuck.map((f) => `<div><b>${esc(f.what)}</b><div class="sub">${esc(f.why)}</div></div>`).join("")}</section>`;
  }
  if (v) out += `<section class="card">${logBox("v2-log", v.log, "Blender v2's log")}</section>`;
  if (at && (at.areas || []).length) {
    const sm = at.summary || {}, done = at.areas.filter((a) => a.done).length;
    out += `<h2 class="section">Atlas of Blender ${esc(at.version || "")}</h2><section class="card">
      <div class="row"><span class="title">${done} of ${at.areas.length} areas read</span><span class="pill ${at.running ? "running" : ""}">${at.running ? "building" : done < at.areas.length ? "paused" : "done"}</span></div>
      <dl class="kv"><dt>techniques</dt><dd>${sm.techniques ?? 0} · ${sm.reachable ?? 0} it can do · ${sm.gaps ?? 0} gaps</dd>
        ${at.built ? `<dt>last built</dt><dd>${esc(ago(at.built))}</dd>` : ""}</dl>
      ${at.running && at.now ? `<div class="sub">${esc(at.now)}</div>` : ""}
      ${at.error ? `<div class="sub warn">stopped: ${esc(at.error)}</div>` : ""}
      ${at.areas.map((a) => `<div class="area"><span>${esc(a.title)} <span class="sub">${esc(a.tier)}</span></span>
          <span class="sub">${a.done ? `${a.reachable}/${a.techniques} reachable` : at.running && at.area === a.title ? "reading now" : "not read yet"}</span>
          <div class="stack" role="img" aria-label="${a.reachable} reachable, ${a.gaps} gaps">${a.techniques
            ? `<span style="flex:${a.reachable}"></span><span style="flex:${a.gaps}"></span>` : ""}</div></div>`).join("")}
      <div class="sub"><span class="ok">■</span> it can do (proved in Blender) · <span class="warn">■</span> gap (no proof ran yet)</div>
      ${!at.running && done < at.areas.length ? `<div class="actions"><button class="primary" data-cmd="atlas.start" data-target="blender" data-label="Atlas">Go on building</button></div>` : ""}
    </section>`;
  }
  return out + spotChecks();
}

const ENGINE = { workshop: "skill", v2: "one skill · known answers", agent: "deployable agent" };
const ACT = { stop: "Stop", resume: "Continue", until: "Train until target", approve: "Approve", start: "Start", more: "One more cycle",
  benchmark: "Take v1's exam", demo: "Run a live demo", report: "Rebuild the report", start_v2: "Train on known answers" };

// A skill's report - how it trained, with its worked examples' pictures - read from the relay (training_report.push).
let report = null, reportProgram = "", reportError = "";
const reportImages = {};
async function openReport(program) {
  reportProgram = program; report = null; reportError = ""; tab = "report"; render(); window.scrollTo(0, 0);
  try {
    const res = await gh(`repos/${store.get("repo")}/contents/reports/${program}.json?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!res.ok) throw new Error(res.status === 404 ? "No report sent yet - press Rebuild the report, then wait a minute." : `GitHub: ${res.status}`);
    report = await res.json();
  } catch (err) { reportError = err.message || String(err); }
  render();
}
async function loadReportImages() {
  for (const img of document.querySelectorAll("img[data-rimg]")) {
    const key = img.dataset.rimg;
    if (reportImages[key] === undefined) {
      reportImages[key] = null;
      try {
        const res = await gh(`repos/${store.get("repo")}/contents/reports/${key}.jpg`, { headers: { Accept: "application/vnd.github.raw+json" } });
        reportImages[key] = res.ok ? URL.createObjectURL(await res.blob()) : "";
      } catch { reportImages[key] = ""; }
    }
    if (reportImages[key]) img.src = reportImages[key]; else if (reportImages[key] === "") img.alt = "picture not sent yet";
  }
}
function reportView() {
  if (reportError) return `<div class="empty">${esc(reportError)}</div><div class="actions"><button data-back>Back</button></div>`;
  const r = report;
  if (!r) return `<div class="empty">Loading the ${esc(reportProgram)} report…</div>`;
  const pic = (name, label) => name ? `<figure class="rpic"><img data-rimg="${esc(r.program)}/${esc(name.replace(/\.[a-z]+$/, ""))}" alt="${esc(label)}"><figcaption>${esc(label)}</figcaption></figure>` : "";
  const example = (ex, n) => `<section class="card">
      <div class="row"><span class="title">${n}. ${esc(ex.title)}</span><span class="pill ${ex.verified ? "approved" : "stopped"}">${pct(ex.score)}</span></div>
      <div class="sub">${esc(ex.why_shown || "")} · ${esc(ex.level || "")} · ${ex.tries || 1} tr${ex.tries === 1 ? "y" : "ies"} · ${esc(short(ex.model))}</div>
      <p>${esc(ex.instruction)}</p>
      <div class="rpics">${pic(ex.pictures.start, "start")}${pic(ex.pictures.goal, "goal (reference)")}${pic(ex.pictures.result, "what it made")}</div>
      ${(ex.requirements || []).length ? (ex.requirements || []).map((q) => `<div class="sub">${q.met ? "✓" : "✗"} ${esc(q.why)}</div>`).join("")
        : (ex.unmet || []).map((u) => `<div class="sub">✗ ${esc(u)}</div>`).join("") || (ex.checks || []).map((c) => `<div class="sub">✓ ${esc(c.label)}</div>`).join("")}
      ${ex.code ? `<details><summary>The code it wrote</summary><div class="log">${esc(ex.code)}</div></details>` : ""}
    </section>`;
  const tiers = Object.values(r.tiers || {});
  return `<div class="actions"><button data-back>← Training</button></div>
    <section class="card"><div class="title">${esc(r.name)} - how the skill trained</div>
      <div class="sub">${esc(r.label)} · built ${esc(r.built)} · ${esc(r.status)}</div>
      <dl class="kv"><dt>practice now</dt><dd>${pct(r.practice_now)}</dd><dt>fully right</dt><dd>${pct(r.verified_share)} of ${r.totals?.attempts || 0}</dd>
        <dt>mastered</dt><dd>${tiers.reduce((a, t) => a + t.mastered, 0)}/${tiers.reduce((a, t) => a + t.techniques, 0)}</dd>
        <dt>procedures</dt><dd>${r.procedures?.kept ?? 0}</dd><dt>v1's exam</dt><dd>${pct(r.v1?.accuracy)}</dd>
        <dt>same exam, merged skill</dt><dd>${pct(r.gate?.v2_on_v1)}</dd></dl>
      ${spark((r.curve || []).filter((_, i, a) => i % Math.max(1, Math.floor(a.length / 40)) === 0))}</section>
    <h2 class="section">Worked examples</h2>${(r.examples || []).map((ex, i) => example(ex, i + 1)).join("") || `<div class="empty">None yet.</div>`}
    <h2 class="section">Live demos (unseen tasks)</h2>${(r.demos || []).map((d, i) => example({ ...d, title: d.technique, why_shown: "unseen task", tries: 1,
      pictures: { start: "", ...d.pictures } }, i + 1)).join("") || `<div class="empty">None yet - Run a live demo on the Training tab.</div>`}
    <h2 class="section">Exams</h2><section class="card">${(r.exams || []).slice(-8).reverse().map((e) => `<div class="row"><span>${esc(e.tier)} · ${esc(String(e.at || "").slice(0, 10))}</span><span>${pct(e.accuracy)}</span></div>`).join("") || `<div class="sub">None yet.</div>`}</section>
    <h2 class="section">Rules it kept</h2><section class="card">${(r.notes || []).filter((n) => n.status === "kept").slice(0, 15).map((n) => `<div class="sub"><b>${esc(n.technique)}</b>: ${esc(n.text)}</div>`).join("") || `<div class="sub">None yet.</div>`}</section>
    <h2 class="section">Skills by other people</h2><section class="card">${(r.outside?.sources || []).map((s) => `<div class="sub">${esc(s.key)} · ${esc(s.license)} · ${s.allowed ? `${s.tips} tips` : `refused: ${esc(s.why)}`}</div>`).join("") || `<div class="sub">Not searched yet.</div>`}</section>`;
}

function unified() {
  // Every training - program skills and deployable agents - with the same card, as the PC's Training screen shows them.
  const list = status?.unified || [];
  const live = list.filter((t) => t.running).length;
  return `<div class="sub">${live} training now · ${list.length} trainings, measured the same way: requirements met on an exam never practised</div>` +
    list.map((t) => `<section class="card">
      <div class="row"><span class="title">${esc(t.name)}</span><span class="pill ${t.running ? "running" : esc(t.status)}">${t.running ? "training" : esc(t.status || "–")}</span></div>
      <div class="row"><span class="big">${pct(t.score)}</span><span class="sub">${esc(ENGINE[t.engine] || t.engine)}${t.target != null ? ` · target ${t.target}%` : ""}${t.fully_right != null ? ` · ${pct(t.fully_right)} fully right` : ""}</span></div>
      <div class="sub">${esc(t.score_label || "")}</div>
      <div class="bar"><span style="width:${Math.min(100, t.score || 0)}%"></span></div>
      ${spark(t.trend)}
      ${(t.capabilities || []).length ? `<details data-key="caps-${esc(t.key)}"${opened.has(`caps-${t.key}`) ? " open" : ""}><summary>By capability (${t.capabilities.length})</summary>
        ${t.capabilities.map((c) => `<div class="area"><span>${esc(c.name)}</span><span class="sub">${esc(c.detail || pct(c.score))}</span>
          <div class="bar"><span style="width:${Math.min(100, c.score || 0)}%"></span></div></div>`).join("")}</details>` : ""}
      ${t.model ? `<div class="sub">model: ${esc(short(t.model))}</div>` : ""}
      ${t.now ? `<div class="sub">${esc(t.now)}</div>` : ""}
      ${!t.running && t.stop_reason ? `<div class="sub">Stopped: ${esc(t.stop_reason)}</div>` : ""}
      ${t.engine === "v2" && t.v1 ? `<div class="sub">One skill · v1's exam ${pct(t.v1.accuracy)} · same exam by the merged skill ${pct(t.gate?.v2_on_v1)} · in use: ${esc(t.in_use || "v1")}</div>` : ""}
      ${t.demo?.running ? `<div class="sub">Live demo: ${esc(t.demo.now || "")}</div>` : t.demo?.last ? `<div class="sub">Last demo: ${esc(t.demo.last)}</div>` : ""}
      ${logBox(`log-${t.key}`, t.log)}
      ${t.engine === "v2" && t.program ? `<div class="actions"><button class="primary" data-report="${esc(t.program)}">See how it trained</button></div>` : ""}
      <div class="actions">${(t.actions || []).map((x) => `<button class="${x === "stop" ? "danger" : x === "until" ? "primary" : ""}" data-cmd="training.act"
          data-target="${esc(t.key)}" data-args='${esc(JSON.stringify({ action: x, target: x === "until" ? (t.target || 90) : null }))}'
          ${x === "approve" ? `data-confirm="Approve ${esc(t.name)}? Its other tries are deleted."` : ""}
          data-label="${esc(t.name)}: ${esc(ACT[x] || x)}">${x === "until" ? `Train until ${t.target || 90}%` : esc(ACT[x] || x)}</button>`).join("")}</div>
    </section>`).join("");
}

function overview() {
  if ((status?.unified || []).length) return unified();
  // Both kinds of training on one screen: the deployable agents first, then the skills.
  const ag = status?.agents || [], sk = status?.trainings || [];
  const live = ag.filter((a) => a.running).length + sk.filter((t) => ["running", "queued"].includes(t.status)).length;
  return `<div class="sub">${live} training now · ${ag.length} deployable agents · ${sk.length} skills</div>
    <h2 class="section">Deployable agents</h2>${agents()}
    <h2 class="section">Skills</h2>${trainings()}
    ${status?.v2 ? `<div class="sub">Blender v2 has its own tab below.</div>` : ""}`;
}

function trainings() {
  const list = status?.trainings || [];
  if (!list.length) return `<div class="empty">No skill training on this PC.</div>`;
  return list.map((t) => {
    const running = ["running", "queued"].includes(t.status);
    const idle = ["stopped", "finished", "failed"].includes(t.status);
    const prog = t.progress ? `<div class="sub">Taking its exam: ${t.progress.done ?? "?"} of ${t.progress.total ?? "?"} tests${t.progress.accuracy != null ? ` · ${pct(t.progress.accuracy)} so far` : ""}</div>` : "";
    return `<section class="card">
      <div class="row"><span class="title">${esc(t.software)}</span><span class="pill ${esc(t.status)}">${esc(t.status)}</span></div>
      <div class="row"><span class="big">${pct(t.exam)}</span><span class="sub">round ${t.round}${t.aim ? ` · aiming at ${t.aim}%` : ""}</span></div>
      <div class="bar"><span style="width:${Math.min(100, t.exam || 0)}%"></span></div>
      ${spark(t.exams)}${prog}
      <dl class="kv">${t.worker ? `<dt>worker</dt><dd>${esc(short(t.worker))}</dd>` : ""}${t.supervisor ? `<dt>grader</dt><dd>${esc(short(t.supervisor))}</dd>` : ""}
        ${t.best != null ? `<dt>best exam</dt><dd>${pct(t.best)} (kept)</dd>` : ""}${t.knowledge ? `<dt>documentation</dt><dd>${Number(t.knowledge).toLocaleString()} passages</dd>` : ""}
        ${t.hours ? `<dt>trained</dt><dd>${t.hours} h</dd>` : ""}</dl>
      ${(t.proof || []).length ? `<div class="sub">last lessons tested: ${t.proof.map((r) => `${Math.round(r.before)}→${Math.round(r.after)}${r.guard ? " (guard)" : ""}`).join(", ")}</div>` : ""}
      ${t.activity || t.now ? `<div class="sub">${esc(t.activity || t.now)}</div>` : ""}
      ${!running && t.stop_reason ? `<div class="sub">Stopped: ${esc(t.stop_reason)}</div>` : ""}
      ${logBox(`skill-${t.id}`, t.log)}
      <div class="actions">
        ${running ? `<button class="danger" data-cmd="skill.stop" data-target="${esc(t.id)}" data-label="Stop ${esc(t.software)}">Stop</button>` : ""}
        ${idle ? `<button data-cmd="skill.resume" data-target="${esc(t.id)}" data-label="Continue ${esc(t.software)}">Continue</button>` : ""}
        ${t.status !== "approved" ? `<button class="primary" data-cmd="skill.aim" data-target="${esc(t.id)}" data-args='{"target":90}' data-label="${esc(t.software)} until 90%">Train until 90%</button>` : ""}
        ${idle && t.status !== "failed" ? `<button data-cmd="skill.approve" data-confirm="Approve ${esc(t.software)}? Its other tries are deleted." data-target="${esc(t.id)}" data-label="Approve ${esc(t.software)}">Approve</button>` : ""}
      </div></section>`;
  }).join("");
}

function agents() {
  const list = status?.agents || [];
  if (!list.length) return `<div class="empty">No deployable-agent project on this PC.</div>`;
  return list.map((a) => `<section class="card">
      <div class="row"><span class="title">${esc(a.name)}</span><span class="pill ${a.running ? "running" : ""}">${a.running ? "training" : esc(a.status)}</span></div>
      <div class="row"><span class="big">${pct(a.exam)}</span><span class="sub">exam on unseen documents${a.before != null ? ` · was ${pct(a.before)}` : ""} · target ${a.target ?? "–"}%</span></div>
      <div class="bar"><span style="width:${Math.min(100, a.exam || 0)}%"></span></div>
      ${spark((a.rounds || []).map((r) => r.headline))}
      <dl class="kv">${a.model ? `<dt>reviewer</dt><dd>${esc(short(a.model))}</dd>` : ""}${a.recipe ? `<dt>line-up</dt><dd>${esc(a.recipe)}</dd>` : ""}
        ${a.real_key ? `<dt>real files</dt><dd>${a.real_key.settled} settled · real ${pct(a.real_key.real.accuracy)} · benchmark ${pct(a.real_key.benchmark.accuracy)}</dd>` : ""}
        ${a.rejected ? `<dt>lessons refused</dt><dd>${a.rejected} (broke something or fixed nothing)</dd>` : ""}</dl>
      ${a.last ? `<div class="sub">${esc(a.last)}</div>` : ""}
      ${logBox(`agent-${a.id}`, a.log)}
      <div class="actions">
        ${a.running ? `<button class="danger" data-cmd="agent.stop" data-target="${a.id}" data-label="Stop ${esc(a.name)}">Stop</button>`
          : `<button class="primary" data-cmd="agent.until" data-target="${a.id}" data-label="${esc(a.name)} until ${a.target ?? 90}%">Train until ${a.target ?? 90}%</button>
             <button data-cmd="agent.more" data-target="${a.id}" data-label="${esc(a.name)}: one more cycle">One more cycle</button>`}
      </div></section>`).join("");
}

function health() {
  // Each model's record: problems first (gone, resting, mostly failing), then the rest by use.
  const list = (status?.health || []).filter((m) => m.ok + m.failed > 0);
  if (!list.length) return "";
  const rank = (m) => (m.missing ? 0 : m.resting ? 1 : m.failed > m.ok ? 2 : 3);
  list.sort((x, y) => rank(x) - rank(y) || y.ok + y.failed - (x.ok + x.failed));
  const row = (m) => {
    const state = m.missing ? `<span class="pill failed">gone</span>` : m.resting ? `<span class="pill stopped">resting</span>`
      : m.failed > m.ok ? `<span class="pill stopped">failing</span>` : `<span class="pill done">ok</span>`;
    return `<tr><td>${esc(short(m.model))}${rank(m) < 3 && m.error ? `<div class="sub">${esc(m.error)}</div>` : ""}</td>
      <td>${m.ok}<span class="sub"> / ${m.failed}</span></td><td>${m.seconds != null ? `${m.seconds}s` : "–"}</td><td>${state}</td></tr>`;
  };
  const head = `<tr><th>Model</th><th>ok / failed</th><th>typical</th><th></th></tr>`;
  const first = list.slice(0, 12), rest = list.slice(12);
  return `<section class="card"><div class="title">How each model is answering</div>
      <table>${head}${first.map(row).join("")}</table>
      ${rest.length ? `<details data-key="health-rest"${opened.has("health-rest") ? " open" : ""}><summary>${rest.length} more</summary><table>${rest.map(row).join("")}</table></details>` : ""}
      <div class="sub">Gone: answered "not found" (hidden for a while). Resting: rate-limited, back within 30 min.</div></section>`;
}

function models() {
  const list = status?.models || [];
  const shares = status?.shares || {};
  const budget = (status?.budget || []).filter((b) => b.limit);
  const docs = status?.documentation || [];
  return `<section class="card"><div class="title">Each free model's day</div>
      <div class="sub">Your chats may use all of it; a training's own work stops at ${Math.round((shares.training || 0.75) * 100)}%,
      checking it (referee, judge, vote, proving lessons) at ${Math.round((shares.verify || 0.45) * 100)}%, the arena at ${Math.round((shares.arena || 0.3) * 100)}%.</div>
      ${budget.map(budgetRow).join("") || `<div class="sub">Nothing used yet today.</div>`}</section>
    ${docs.length ? `<section class="card"><div class="title">Documentation the agents search</div><table><tr><th>Program</th><th>Pages</th><th>Passages</th></tr>
      ${docs.filter((d) => d.chunks).map((d) => `<tr><td>${esc(d.app)}${d.partial ? ' <span class="sub">(filling in)</span>' : ""}</td><td>${d.pages.toLocaleString()}</td><td>${d.chunks.toLocaleString()}</td></tr>`).join("")}</table></section>` : ""}
    ${health()}
    <section class="card"><table><tr><th>Free model</th><th>Today</th><th></th></tr>${list.map((m) =>
    `<tr><td>${esc(m.model)}</td><td>${m.today ?? "–"}</td><td>${m.blocked_for > 0 ? `<span class="pill stopped">resting ${Math.round(m.blocked_for / 3600)} h</span>` : ""}</td></tr>`).join("")}</table></section>`;
}

function admin() {

        `<tr><td>${esc(a.admin)}<div class="sub">${Object.entries(a.kinds || {}).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([k, n]) => `${esc(k)} ×${n}`).join(", ")}</div></td><td>${a.actions}</td><td class="sub">${esc((a.last || "").replace("T", " ").slice(0, 16))}</td></tr>`).join("")}</table>`
        : `<div class="sub">${esc(act.error || "No admin activity reported yet.")}</div>`}
    </section>
    <section class="card"><div class="title">Recent admin actions</div>
      ${(act.recent || []).slice(0, 12).map((e) => `<div class="row"><span>${esc(e.kind)} <span class="sub">${esc(e.on)}</span></span><span class="sub">${esc(e.github || e.who)} · ${esc(e.at.replace("T", " ").slice(5, 16))}</span></div>`).join("") || `<div class="sub">None yet.</div>`}
    </section>
    <section class="card"><div class="title">Apps in use (anonymous)</div>
      ${counts.set_up ? `<div class="row"><span class="big">${counts.app_days ?? 0}</span><span class="sub">app-days in ${counts.days} days</span></div>
        ${(counts.versions || []).slice(0, 6).map((v) => `<div class="row"><span>${esc(v.path.replace("/app/", ""))}</span><span>${v.count}</span></div>`).join("")}
        <div class="sub">Features used</div>${(counts.features || []).slice(0, 8).map((f) => `<div class="row"><span>${esc(f.feature)}</span><span>${f.count}</span></div>`).join("")}`
        : `<div class="sub">${esc(counts.why || "Not set up.")}</div>`}
    </section>
    <section class="card"><div class="title">Downloads</div>
      <div class="row"><span class="big">${dl.total ?? 0}</span><span class="sub">all releases</span></div>
      ${(dl.releases || []).slice(0, 6).map((r) => `<div class="row"><span>${esc(r.version)}</span><span>${r.downloads}</span></div>`).join("")}

}

function settings() {
  const repo = store.get("repo");
  return `<section class="card">
      <div class="title">Connect to your PC</div>
      <div class="sub">On the PC: Settings → Phone dashboard → Turn on. It shows the pairing code and the repository.</div>
      <label>GitHub token<input id="f-token" type="password" autocomplete="off" value="${esc(store.get("token"))}" placeholder="github_pat_…"></label>
      <div class="sub">Make one that reaches only the relay repository:
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">new fine-grained token</a>
        → Repository access: only <b>${esc(repo.split("/")[1] || "aGENticHub-remote")}</b> → Permissions: Contents <b>Read and write</b>.</div>
      <label>Repository<input id="f-repo" value="${esc(repo)}" placeholder="you/aGENticHub-remote"></label>
      <label>Pairing code<input id="f-code" value="${esc(store.get("code"))}" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters"></label>

// ---------------------------------------------------------------------------------------------------------------
// The simple phone: Home (is the PC on, what needs you, your skills), a page per skill, Check (is each result
// right?), More (models, Blender's map, admin, this phone). Plain words; one clear action; feedback on every step.
// ---------------------------------------------------------------------------------------------------------------
const WORD = { running: "Training", approved: "Ready", stopped: "Paused", finished: "Paused", failed: "Stopped",
  "not started": "Not started", "needs you": "Needs you", queued: "Waiting", error: "Problem" };
const SAY = { stop: "Pause", resume: "Continue", until: "Train until target", approve: "Use this skill", start: "Start training",
  more: "One more round", benchmark: "Compare with the old skill", demo: "Try it on a new task", report: "Update the report",
  start_v2: "Start the new training" };
const ASK = {
  approve: (t) => t.engine === "v2" ? `Give your agents the merged ${t.name} skill? The old one stays inside it.`
    : `Approve ${t.name}? Its other tries are deleted.`,
  start_v2: (t) => `Start ${t.name}'s new training? It reads the program's documentation first, then practises on tasks with known answers. The current skill stays in use until the new one is better.`,
  stop: (t) => `Pause ${t.name}'s training? You can continue it any time.`,
};
let skillKey = store.get("skill") || "";
let progress = null;                              // the command on its way: {label, stage, ok}

// What a training says it is doing, in plain words (its log is written for the developer).
const PLAIN = [
  [/^today's plan: (\d+) technique-levels.*$/, (m) => `Practising ${m[1]} techniques today`],
  [/^mapping .* first.*$/, () => "Reading the program's documentation and testing what it can do"],
  [/^v1's exam, taken by v2: ([\d.]+)%.*\(v1: ([\d.]+)%\).*$/, (m) => `Compared with the old skill: new ${Math.round(m[1])}%, old ${Math.round(m[2])}%`],
  [/^(.+?) \((drill|start_goal)\), try (\d+):.*$/, (m) => `Practising: ${m[1]}${m[3] > 1 ? ` (try ${m[3]})` : ""}`],
  [/^(.+?) \((drill|start_goal)\): ([\d.]+)% of requirements.*$/, (m) => `${m[1]}: ${Math.round(m[3])}% right`],
  [/^(.+?) \((drill|start_goal)\): .*wrote no code.*$/, (m) => `${m[1]}: the model did not answer - not counted`],
  [/^[^:]+: (.+) - (sandbox|typed)$/, (m) => `Learned it can do: ${m[1]}`],
  [/^[^:]+: (.+) - gap$/, (m) => `Cannot do yet (tried again weekly): ${m[1]}`],
  [/^[^:]+: reading .*$/, () => "Reading the documentation"],
  [/^outside skills?: .*$/, () => "Learning from skills other people published"],
  [/^no free model has training room.*$/, () => "Waiting for tomorrow's free model allowance"],
  [/^.*resting (\d+) minutes.*$/, (m) => `The free model is busy - resting ${m[1]} minutes`],
];
function plain(text) {
  const s = String(text || "").trim();
  for (const [re, fn] of PLAIN) { const m = s.match(re); if (m) return fn(m); }
  return s;
}

function word(t) { return t.running ? "Training" : WORD[t.status] || (t.status ? t.status[0].toUpperCase() + t.status.slice(1) : "–"); }
function tone(t) { return t.running ? "running" : t.status === "approved" ? "done" : ["stopped", "finished", "failed", "needs you"].includes(t.status) ? "stopped" : ""; }

function scoreLine(t) {
  if (t.score == null) return t.engine === "v2" ? "Still learning the program - no score yet." : "No exam yet.";
  if (t.engine === "v2") return `Gets <b>${pct(t.score)}</b> of each practice task right (checked from the file itself).`;
  if (t.kind === "agent") return `Gets <b>${pct(t.score)}</b> right on documents it never saw.`;
  return `Exam: <b>${pct(t.score)}</b> of each task's requirements met.`;
}

function progressBanner() {
  if (!progress) return "";
  const icon = progress.ok === true ? "✓" : progress.ok === false ? "!" : `<span class="spin"></span>`;
  return `<section class="card banner ${progress.ok === false ? "alert bad" : progress.ok ? "good" : ""}">
      <div class="row"><span><b>${icon}</b> ${esc(progress.label)}</span>${progress.ok != null ? `<button class="link" data-dismiss>OK</button>` : ""}</div>
      <div class="sub">${esc(progress.stage)}</div></section>`;
}

function pcHero() {
  if (!status) return "";
  const quiet = (Date.now() - Date.parse(status.at_utc || "")) / 60000;
  const list = status.unified || [];
  const live = list.filter((t) => t.running).length;
  if (quiet > 20) {
    const gap = quiet < 120 ? `${Math.round(quiet)} minutes` : `${Math.round(quiet / 60)} hours`;
    return `<section class="card hero off"><div class="hero-line"><span class="dot off"></span><b>Your PC is not answering</b></div>
      <div class="sub">Nothing came from ${esc(status.host)} for ${gap}. It is asleep, off or offline - training waits until it is back.
      What you see below is from ${esc(String(status.at).slice(11, 16))}.</div></section>`;
  }
  return `<section class="card hero"><div class="hero-line"><span class="dot on"></span><b>Your PC is on</b>
      <span class="sub">· ${live ? `${live} training${live === 1 ? "" : "s"} running` : "nothing training"}</span></div>
      ${pcTiles()}</section>`;
}

function needsYou() {
  const alerts = (status?.alerts || []);
  if (!alerts.length) return `<section class="card calm"><b>Nothing needs you</b><div class="sub">Everything is running by itself.</div></section>`;
  return alerts.slice(0, 6).map((a) => {
    const t = a.action && (status.unified || []).find((x) => x.key === a.action.key);
    const button = a.tab ? `<button class="primary" data-go="${esc(a.tab)}">Open</button>`
      : t ? `<button class="primary" data-cmd="training.act" data-target="${esc(t.key)}" data-args='${esc(JSON.stringify({ action: a.action.do }))}'
              ${ASK[a.action.do] ? `data-confirm="${esc(ASK[a.action.do](t))}"` : ""} data-label="${esc(t.name)}: ${esc(SAY[a.action.do] || a.action.do)}">${esc(SAY[a.action.do] || a.action.do)}</button>` : "";
    return `<section class="card alert ${a.level === "bad" ? "bad" : ""}"><div>${esc(a.text)}</div>${button ? `<div class="actions">${button}</div>` : ""}</section>`;
  }).join("");
}

function skillTiles() {
  const list = (status?.unified || []).filter((t) => t.kind !== "error");
  if (!list.length) return `<div class="empty">No skills on this PC yet.</div>`;
  return `<div class="grid">${list.map((t) => `<button class="skill ${tone(t)}" data-skill="${esc(t.key)}">
      <span class="skill-name">${esc(t.name)}</span>
      <span class="skill-score">${t.score == null ? `<span class="sub">learning…</span>` : pct(t.score)}</span>
      <span class="bar"><span style="width:${Math.min(100, t.score || 0)}%"></span></span>
      <span class="skill-state">${t.running ? `<span class="spin small"></span> ` : ""}${esc(word(t))}${t.kind === "agent" ? " · agent" : ""}</span>
    </button>`).join("")}</div>`;
}

function home() {
  if (!status) return `<div class="empty">No news from your PC yet.</div>`;
  const events = (status.events || []).slice(0, 6).map((e) =>
    `<div class="event"><time>${esc(when(e.at))}</time><span><em>${esc(e.from)}</em> ${esc(plain(e.what))}</span></div>`).join("");
  const more = (status.events || []).slice(6, 30).map((e) =>
    `<div class="event"><time>${esc(when(e.at))}</time><span><em>${esc(e.from)}</em> ${esc(e.what)}</span></div>`).join("");
  return `${progressBanner()}${pcHero()}
    <h2 class="section">Needs you</h2>${needsYou()}
    <h2 class="section">Your skills</h2>${skillTiles()}
    <div class="sub hint">Tap a skill to see how it trained, pause it or try it.</div>
    <h2 class="section">Lately</h2><section class="card">${events || `<div class="sub">Nothing yet.</div>`}
      ${more ? `<details data-key="home-more"${opened.has("home-more") ? " open" : ""}><summary>Show more</summary>${more}</details>` : ""}</section>`;
}

function skillsList() {
  const list = (status?.unified || []).filter((t) => t.kind !== "error");
  return `${progressBanner()}<div class="sub hint">Each skill is measured the same way: the share of each task done right, checked by code on tasks it never practised.</div>
    ${list.map((t) => `<button class="card rowcard" data-skill="${esc(t.key)}">
      <div class="row"><span class="title">${esc(t.name)}</span><span class="pill ${tone(t)}">${esc(word(t))}</span></div>
      <div class="row"><span class="big">${t.score == null ? `<span class="sub">learning…</span>` : pct(t.score)}</span><span class="sub">${t.kind === "agent" ? "deployable agent" : "skill"}</span></div>
      <div class="bar"><span style="width:${Math.min(100, t.score || 0)}%"></span></div>
      ${t.now ? `<div class="sub clip">${esc(plain(t.now))}</div>` : ""}</button>`).join("") || `<div class="empty">No skills on this PC yet.</div>`}`;
}

function actionButton(t, x, primary) {
  return `<button class="${primary ? "primary" : x === "stop" ? "danger" : ""}" data-cmd="training.act" data-target="${esc(t.key)}"
      data-args='${esc(JSON.stringify({ action: x, target: x === "until" ? (t.target || 90) : null }))}'
      ${ASK[x] ? `data-confirm="${esc(ASK[x](t))}"` : ""}
      data-label="${esc(t.name)}: ${esc(SAY[x] || x)}">${x === "until" ? `Train until ${t.target || 90}%` : esc(SAY[x] || x)}</button>`;
}

function skillPage() {
  const t = (status?.unified || []).find((x) => x.key === skillKey);
  if (!t) return `<div class="actions"><button data-go="home">← Home</button></div><div class="empty">This skill is not on the PC any more.</div>`;
  const acts = (t.actions || []).filter((x) => x !== "report");
  const main = acts.find((x) => ["approve", "start", "resume", "start_v2", "until"].includes(x)) || acts.find((x) => x === "stop");
  const rest = acts.filter((x) => x !== main);
  const v1 = t.v1 || null, gate = t.gate || {};
  const compare = t.engine === "v2" && v1 && v1.accuracy != null ? `<section class="card">
      <div class="title">Old skill vs new skill</div>
      <div class="versus"><div><b>${pct(v1.accuracy)}</b><span>the skill in use (v1) on its exam</span></div>
        <div><b class="${gate.beats_v1 ? "ok" : ""}">${pct(gate.v2_on_v1)}</b><span>the new skill on the same exam</span></div></div>
      <div class="sub">${gate.v2_on_v1 == null ? "The new skill has not taken this exam yet." : gate.beats_v1
        ? "The new skill is better - you can give it to your agents." : "The old skill stays in use until the new one beats it."}</div></section>` : "";
  const attempts = (t.attempts || []).slice(0, 6).map((a) => `<div class="event"><time>${a.verified ? `<b class="ok">✓</b>` : `<b class="${(a.score || 0) >= 50 ? "warn" : "bad"}">${pct(a.score)}</b>`}</time>
      <span>${esc(a.title)}${!a.verified && (a.unmet || []).length ? `<div class="sub">missed: ${a.unmet.slice(0, 2).map(esc).join("; ")}</div>` : ""}</span></div>`).join("");
  return `${progressBanner()}<div class="actions"><button data-go="${esc(store.get("from") || "home")}">← Back</button></div>
    <section class="card">
      <div class="row"><span class="title big-title">${esc(t.name)}</span><span class="pill ${tone(t)}">${esc(word(t))}</span></div>
      <div class="lead">${scoreLine(t)}</div>
      ${t.now ? `<div class="sub">Now: ${esc(plain(t.now))}</div>` : ""}
      ${t.demo?.running ? `<div class="sub"><span class="spin small"></span> Trying it on a new task: ${esc(t.demo.now || "")}</div>` : t.demo?.last ? `<div class="sub">Last try on a new task: ${esc(t.demo.last)}</div>` : ""}
      ${t.engine === "v2" && t.program ? `<button class="primary wide" data-report="${esc(t.program)}">See how it trained →</button>` : ""}
      <div class="actions">${main ? actionButton(t, main, !(t.engine === "v2" && t.program)) : ""}${rest.map((x) => actionButton(t, x, false)).join("")}</div>
    </section>
    ${compare}
    ${attempts ? `<section class="card"><div class="title">Its latest tries</div>${attempts}</section>` : ""}
    <section class="card"><details data-key="sk-${esc(t.key)}"${opened.has(`sk-${t.key}`) ? " open" : ""}><summary>More details</summary>
      ${(t.capabilities || []).map((c) => `<div class="area"><span>${esc(c.name)}</span><span class="sub">${esc(c.detail || pct(c.score))}</span>
        <div class="bar"><span style="width:${Math.min(100, c.score || 0)}%"></span></div></div>`).join("")}
      ${t.model ? `<div class="sub">model: ${esc(short(t.model))}</div>` : ""}
      ${(t.exams || []).length ? `<div class="sub">exams: ${t.exams.map((e) => `${esc(e.label)} ${pct(e.headline)}`).join(" · ")}</div>` : ""}
      ${logBox(`log-${t.key}`, t.log, "What it did lately")}</details></section>`;
}

function checkView() {
  const spots = status?.spots || [];
  const items = spots.flatMap((s) => s.items.map((i) => ({ ...i, program: s.program, name: s.name })));
  const open = items.filter((i) => !i.grade), done = items.filter((i) => i.grade);
  if (!items.length) return `${progressBanner()}<div class="empty">Nothing to check this week.</div>`;
  const card = (i) => `<section class="card">
      <div class="row"><span class="title">${esc(i.name)}: ${esc(i.title)}</span></div>
      <div class="sub">The task: ${esc(i.instruction)}</div>
      <div class="pics"><figure class="rpic"><img data-spot="${esc(i.id)}-render" alt="what it made"><figcaption>what it made</figcaption></figure>
        <figure class="rpic"><img data-spot="${esc(i.id)}-goal" alt="the goal"><figcaption>the goal</figcaption></figure></div>
      <div class="sub">The checks say: ${i.verified ? `<b class="ok">all right</b>` : `<b class="warn">${pct(i.score)} right</b>`}${(i.unmet || []).length ? ` - missed ${i.unmet.slice(0, 2).map(esc).join("; ")}` : ""}</div>
      ${i.grade ? `<div class="pill done">You said: ${esc(i.grade)}</div>` : `<div class="lead">Did it do the task right?</div>
        <input data-note="${esc(i.id)}" placeholder="What is wrong? (optional)" value="${esc(spotNotes[i.id] || "")}">
        <div class="actions three">
          <button class="primary" data-spot-grade="right" data-id="${esc(i.id)}" data-program="${esc(i.program)}">Right</button>
          <button class="danger" data-spot-grade="wrong" data-id="${esc(i.id)}" data-program="${esc(i.program)}">Wrong</button>
          <button data-spot-grade="skip" data-id="${esc(i.id)}" data-program="${esc(i.program)}">Not sure</button></div>`}
    </section>`;
  return `${progressBanner()}<div class="sub hint">A few results a week, picked where the checks might be wrong. Your answer is the final word: a "wrong" on a result the checks passed takes its task out of practice.</div>
    ${open.length ? `<h2 class="section">${open.length} to check</h2>${open.map(card).join("")}` : `<section class="card calm"><b>All checked for this week</b></section>`}
    ${done.length ? `<details data-key="check-done"${opened.has("check-done") ? " open" : ""}><summary>${done.length} already checked</summary>${done.map(card).join("")}</details>` : ""}`;
}

function more() {
  const item = (tab, title, sub) => `<button class="card rowcard" data-go="${tab}"><div class="title">${title}</div><div class="sub">${sub}</div></button>`;
  return `${item("models", "Free models", "How much of each model's day is used, and how each is answering")}
    ${(status?.agents || []).length ? item("agents", "Deployable agents", "Their exams and training") : ""}
    ${status?.v2 || status?.atlas ? item("blender", "Blender in depth", "Its map of techniques, procedures and the full log") : ""}
    ${status?.master ? item("admin", "Admin", "Admins, downloads, apps in use") : ""}
    ${item("settings", "This phone", "Connection to your PC")}
    <div class="sub hint" style="text-align:center">Phone app version ${esc(APP_VERSION)}</div>`;
}

function render() {
  const [state, text] = freshness();
  $("#meta").innerHTML = `<span class="dot ${state}"></span>${text}${status?.version ? ` · ${esc(status.version)}` : ""}`;
  $("#nav").hidden = !store.get("token");
  const pending = (status?.spots || []).reduce((n, s) => n + (s.pending || 0), 0);
  $("#tab-check").innerHTML = `Check${pending ? `<span class="badge">${pending}</span>` : ""}`;
  const parent = { skill: "skills", report: "skills", models: "more", agents: "more", blender: "more", admin: "more", settings: "more" }[tab] || tab;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === parent));
  if (tab === "admin" && !status?.master) tab = "more";
  const views = { home, skills: skillsList, check: checkView, more, skill: skillPage, blender, models, admin, settings,
                  agents: () => agents(), report: reportView };
  $("#main").innerHTML = (views[tab] || home)();
  document.querySelectorAll("[data-skill]").forEach((b) => (b.onclick = () => {
    store.set("from", tab); skillKey = b.dataset.skill; store.set("skill", skillKey); tab = "skill"; render(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { tab = b.dataset.go; store.set("tab", tab); render(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-dismiss]").forEach((b) => (b.onclick = () => { progress = null; render(); }));
  document.querySelectorAll("[data-report]").forEach((b) => (b.onclick = () => openReport(b.dataset.report)));
  document.querySelectorAll("[data-back]").forEach((b) => (b.onclick = () => { tab = skillKey ? "skill" : "skills"; render(); }));
  loadReportImages();
  document.querySelectorAll("details[data-key]").forEach((d) => {
    d.ontoggle = () => { if (d.open) opened.add(d.dataset.key); else opened.delete(d.dataset.key); };
  });
  document.querySelectorAll("[data-cmd]").forEach((b) => {
    b.disabled = busy;
    b.onclick = () => {
      if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
      command(b.dataset.cmd, b.dataset.target, b.dataset.args ? JSON.parse(b.dataset.args) : {}, b.dataset.label);
    };
  });
  document.querySelectorAll("[data-note]").forEach((el) => { el.oninput = () => { spotNotes[el.dataset.note] = el.value; }; });
  document.querySelectorAll("[data-spot-grade]").forEach((b) => {
    b.disabled = busy;
    b.onclick = () => command("spot.grade", b.dataset.id, { verdict: b.dataset.spotGrade, note: spotNotes[b.dataset.id] || "",
                                                             program: b.dataset.program || "blender" },
                              `Your answer: ${b.dataset.spotGrade === "skip" ? "not sure" : b.dataset.spotGrade}`);
  });
  loadSpotImages();
  const save = $("#f-save");
  if (save) save.onclick = async () => {
    store.set("token", $("#f-token").value.trim()); store.set("code", $("#f-code").value.trim());
    let repo = $("#f-repo").value.trim();
    if (!repo && store.get("token")) {
      const me = await gh("user"); if (me.ok) repo = `${(await me.json()).login}/aGENticHub-remote`;
    }
    store.set("repo", repo); tab = "home"; await load();
  };
}

document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; store.set("tab", tab); render(); window.scrollTo(0, 0); }));
$("#refresh").onclick = async () => { $("#refresh").textContent = "…"; await load(); $("#refresh").textContent = "↻ Refresh"; };
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastFetch > 20000) load(); });
setInterval(() => { if (!document.hidden) load(); }, 60000);
// A newer version of this page is picked up by itself: the browser is asked for a fresh sw.js whenever the app comes
// back to the screen, and when a new one takes over, the page reloads once. An app left open used to keep running its
// old code for days - only the data refreshed.
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 15 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
}
load();
</script>
</body>
</html>
